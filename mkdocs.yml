site_name: TerraFin Docs
site_description: TerraFin is a set of investment-research skills for AI agents, and an agent harness built on those same skills.
site_url: https://kiungsong.github.io/TerraFin/
repo_url: https://github.com/KiUngSong/TerraFin
repo_name: KiUngSong/TerraFin
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/terrafin-mark.svg
  favicon: assets/terrafin-mark.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/header-home-link.js
  - javascripts/mermaid-zoom.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KiUngSong/TerraFin
    - icon: fontawesome/solid/book-open
      link: https://github.com/KiUngSong/TerraFin/tree/main/docs

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Configuration: getting-started/configuration.md
      - Deployment & Operations: getting-started/deployment.md
      - Model Management: getting-started/models.md
  - Skills:
      - Overview: skills/index.md
      - For External Agents: skills/external-agents.md
      - Usage: skills/usage.md
      - API Reference: skills/api-reference.md
      - Glossary: skills/glossary.md
  - Agent Harness Internals:
      - Overview: harness/index.md
      - The Agent Loop: harness/loop.md
      - Deep Research: harness/deep-research.md
      - Hosted Runtime: harness/hosted-runtime.md
      - Architecture and Personas: harness/architecture.md
  - Product Guides:
      - Interface Overview: guides/interface.md
      - Examples & Workflows: guides/examples.md
  - Reference:
      - Architecture Overview: reference/architecture.md
      - Data Layer: reference/data-layer.md
      - Private Data Wire Spec: reference/private-data-wire-spec.md
      - Analytics: reference/analytics.md
      - Analytics Notes: reference/analytics-notes.md
      - Caching: reference/caching.md
      - Chart Architecture: reference/chart-architecture.md
      - Feature Integration: reference/feature-integration.md
      - UI Design System: reference/ui-design-system.md
  - Development:
      - Development Guide: development/index.md
      - Notebooks: development/notebooks.md
      - License & Data Rights: development/legal.md
